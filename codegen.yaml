# yaml-language-server: $schema=./codegen.schema.json
name: AgentEngine
description: ''
contexts:
- name: Shared
  domain:
    value_objects:
    - name: SessionId
      description: Agent 执行会话的唯一标识
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: any
      - name: __str__
        output:
          type: any
      - name: serialize
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: any
          name: data
        output:
          type: any
    - name: JobId
      description: 调度派发任务的唯一标识
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: any
      - name: __str__
        output:
          type: any
      - name: serialize
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: any
          name: data
        output:
          type: any
    - name: TaskId
      description: 关联到远端 TaskGraph 的任务标识
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: any
      - name: __str__
        output:
          type: any
      - name: serialize
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: any
          name: data
        output:
          type: any
- name: Execution
  domain:
    aggregates:
    - name: AgentSession
      description: 聚合根 — 一次完整的 Agent 运行生命周期，包括 Prompt 组装、工具挂载和最终输出。
      attributes:
      - type: SessionId
        name: id
      - type: JobId
        name: job_id
      - type: dict
        name: context_payload
      - type: SessionStatus
        name: status
      - type: string
        optional: true
        name: final_output
      - type: string
        optional: true
        name: error_message
      behaviors:
      - name: start
        output:
          type: None
      - name: finish_with_success
        inputs:
        - type: string
          name: output
        output:
          type: None
      - name: finish_with_error
        inputs:
        - type: string
          name: error
        output:
          type: None
    enums:
    - name: SessionStatus
      members:
      - name: IDLE
        value: idle
      - name: RUNNING
        value: running
      - name: SUCCESS
        value: success
      - name: ERROR
        value: error
    - name: ModelTier
      description: 模型能力档位定义
      members:
      - name: PRO
        value: pro
      - name: FAST
        value: fast
    ports:
    - name: AgentGateway
      description: Agent 底层调用网关
      kind: adapter
      operations:
      - name: run
        inputs:
        - type: string
          name: system_prompt
        - type: string
          name: user_prompt
        - type: string
          container: list
          name: tools
        - type: ModelTier
          optional: true
          name: model_tier
          default: None
        output:
          type: string
      - name: run_stream
        description: 流式执行 Agent 并返回文本块迭代器
        inputs:
        - type: string
          name: system_prompt
        - type: string
          name: user_prompt
        - type: string
          container: list
          name: tools
        - type: ModelTier
          optional: true
          name: model_tier
          default: None
        output:
          type: Any
          custom_type_string: AsyncIterator[str]
    - name: AgentSessionRepository
      kind: repository
      aggregate: AgentSession
      operations:
      - name: save
        inputs:
        - type: AgentSession
          name: session
        output:
          type: None
      - name: delete
        inputs:
        - type: SessionId
          name: agent_session_id
        output:
          type: None
      - name: find_by_id
        inputs:
        - type: SessionId
          name: agent_session_id
        output:
          type: AgentSession
          optional: true
  application:
    use_cases:
    - name: ExecuteAgentSession
      kind: command
      dependencies:
      - type: AgentGateway
        name: agent_gateway
      - type: AgentSessionRepository
        name: session_repo
      command:
        attributes:
        - type: JobId
          name: job_id
        - type: string
          name: system_prompt
        - type: string
          optional: true
          name: requirement
        - type: any
          container: map
          optional: true
          name: context_payload
        - type: ModelTier
          optional: true
          name: model_tier
      result:
        attributes:
        - type: SessionId
          name: session_id
        - type: boolean
          name: is_success
        - type: string
          optional: true
          name: output
  infrastructure:
    implementations:
    - name: SqlAlchemySessionRepository
      implements: AgentSessionRepository
      technology: sql
      description: 使用 PostgreSQL 持久化 Agent 会话日志和状态
      attributes:
      - type: Any
        custom_type_string: async_sessionmaker[AsyncSession]
        name: session_factory
    - name: ClaudeAgentGateway
      implements: AgentGateway
      technology: claude
      description: 封装对 Claude Agent SDK 的调用，将工具和 Prompt 注入并执行
    - name: AgentGatewayRouter
      implements: AgentGateway
      technology: agent
      description: '根据默认提供商将请求路由到具体的网关。

        具体的网关实现负责将 ModelTier 映射到它们支持的具体模型名称。'
      attributes:
      - type: AgentGateway
        name: claude_gateway
      - type: AgentGateway
        name: gemini_gateway
      - type: string
        name: default_provider
        default: '''gemini'''
    - name: GeminiAgentGateway
      implements: AgentGateway
      technology: gemini
      description: 封装对 Gemini Cli 的调用，将工具和 Prompt 注入并执行
- name: Orchestration
  domain:
    aggregates:
    - name: DispatchJob
      description: 聚合根 — 记录一次从 TaskGraph 拉取任务并尝试执行的分发记录。
      attributes:
      - type: JobId
        name: id
      - type: TaskId
        optional: true
        name: task_id
      - type: JobStatus
        name: status
      - type: SessionId
        optional: true
        name: session_id
      behaviors:
      - name: mark_running
        inputs:
        - type: SessionId
          name: session_id
        output:
          type: None
      - name: mark_completed
        output:
          type: None
      - name: mark_failed
        inputs:
        - type: string
          name: reason
        output:
          type: None
    enums:
    - name: JobStatus
      members:
      - name: PENDING
        value: pending
      - name: RUNNING
        value: running
      - name: COMPLETED
        value: completed
      - name: FAILED
        value: failed
    - name: TaskStatus
      description: The lifecycle state of a task.
      members:
      - name: PENDING
        value: pending
      - name: BLOCKED
        value: blocked
      - name: READY
        value: ready
      - name: IN_PROGRESS
        value: in_progress
      - name: REVIEW
        value: review
      - name: DONE
        value: done
      - name: CHANGES_REQUESTED
        value: changes_requested
      - name: SKIPPED
        value: skipped
      - name: DISCARDED
        value: discarded
    - name: PlanningLevel
      description: Defines the uncertainty and granularity of the task.
      members:
      - name: INITIATIVE
        value: initiative
      - name: MILESTONE
        value: milestone
      - name: ARCHITECTURAL
        value: architectural
      - name: FEATURE
        value: feature
      - name: ATOMIC
        value: atomic
    - name: RecurrenceType
      members:
      - name: ON_SUCCESS
        value: on_success
      - name: CRON
        value: cron
      - name: ON_FAILURE
        value: on_failure
    value_objects:
    - name: ReadyTaskDTO
      description: 防腐层数据契约：从 TaskGraph 读取的、随时可被派发的任务快照
      attributes:
      - type: TaskId
        name: task_id
      - type: string
        name: planning_level
      - type: string
        name: status
      - type: string
        name: name
    - name: SopContent
      attributes:
      - type: string
        name: system_prompt
      - type: ModelTier
        optional: true
        name: model_tier
        default: None
    ports:
    - name: DomainEventListenerPort
      description: 端口：领域事件监听器，以异步迭代器形式持续产出事件
      kind: adapter
      operations:
      - name: listen
        output:
          type: Any
          custom_type_string: AsyncIterator[DispatchableTaskEvent]
      - name: close
        output:
          type: None
    - name: DispatchJobRepository
      kind: repository
      aggregate: DispatchJob
      operations:
      - name: save
        inputs:
        - type: DispatchJob
          name: job
        output:
          type: None
      - name: delete
        inputs:
        - type: JobId
          name: dispatch_job_id
        output:
          type: None
      - name: find_by_id
        inputs:
        - type: JobId
          name: dispatch_job_id
        output:
          type: DispatchJob
          optional: true
    - name: ExecutionTriggerPort
      description: 定义一个明确的跨上下文调用端口，用于触发 Execution 域。
      kind: adapter
      operations:
      - name: trigger_session
        inputs:
        - type: JobId
          name: job_id
        - type: string
          name: system_prompt
        - type: string
          optional: true
          name: requirement
          default: None
        - type: dict
          optional: true
          name: context_payload
          default: None
        - type: ModelTier
          optional: true
          name: model_tier
          default: None
        output:
          type: SessionId
    - name: SopRepository
      description: SOP 仓储，根据 planning_level 和 status 加载对应的操作规程
      kind: repository
      aggregate: Sop
      operations:
      - name: get_sop
        inputs:
        - type: string
          name: planning_level
        - type: string
          name: status
        output:
          type: SopContent
    - name: TaskGraphQueryPort
      description: 防腐层：读取 TaskGraph 状态的只读接口，未来可替换为事件订阅(Pub/Sub)客户端。
      kind: adapter
      operations:
      - name: fetch_ready_tasks
        output:
          type: ReadyTaskDTO
          container: list
  application:
    use_cases:
    - name: HandleDispatchableTaskEvent
      kind: command
      dependencies:
      - type: DispatchJobRepository
        name: job_repo
      - type: ExecutionTriggerPort
        name: execution_trigger
      - type: SopRepository
        name: sop_repo
      result:
        attributes:
        - type: string
          name: job_id
        - type: string
          name: session_id
    - name: StartInitialWorkflow
      kind: command
      dependencies:
      - type: DispatchJobRepository
        name: job_repo
      - type: ExecutionTriggerPort
        name: execution_trigger
      - type: SopRepository
        name: sop_repo
      - type: string
        name: project_id
      command:
        attributes:
        - type: string
          name: raw_requirement
      result:
        attributes:
        - type: string
          name: initial_session_id
    - name: RunEventLoopTick
      kind: command
      dependencies:
      - type: TaskGraphQueryPort
        name: task_query_port
      - type: DispatchJobRepository
        name: job_repo
      - type: ExecutionTriggerPort
        name: execution_trigger
      - type: SopRepository
        name: sop_repo
      result:
        attributes:
        - type: integer
          name: dispatched_count
  infrastructure:
    implementations:
    - name: SqlAlchemyDispatchJobRepository
      implements: DispatchJobRepository
      technology: sql
      description: 使用 PostgreSQL 持久化 Job 记录
      attributes:
      - type: Any
        custom_type_string: async_sessionmaker[AsyncSession]
        name: session_factory
    - name: InProcessExecutionTrigger
      implements: ExecutionTriggerPort
      technology: in
      description: 进程内直接调用 Execution 域的应用层服务 (UseCase) 触发任务
      attributes:
      - type: ExecuteAgentSession
        name: execute_agent_session
    - name: TaskGraphAdapter
      implements: TaskGraphQueryPort
      technology: task
      description: 通过 TaskGraph 服务获取 Ready 任务
    - name: PgNotifyEventListener
      implements: DomainEventListenerPort
      technology: pg
      description: 基于 PostgreSQL LISTEN/NOTIFY 的领域事件监听实现
    - name: LocalFileSopRepository
      implements: SopRepository
      technology: local
      description: 从本地文件系统（sops/ 目录）读取带有 Frontmatter 的 Markdown 格式 SOP，并整理为 system_prompt
      attributes:
      - type: string
        optional: true
        name: base_dir
      private_methods:
      - name: _build_system_prompt
        inputs:
        - type: dict
          name: metadata
        - type: string
          name: content
        output:
          type: string
- name: Entrypoints
- name: Sops
- name: Integration
  domain:
    enums:
    - name: ChatType
      description: 飞书聊天类型
      members:
      - name: P2P
        value: p2p
      - name: GROUP
        value: group
    value_objects:
    - name: FeishuMessageId
      description: 飞书消息唯一标识
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: string
          name: value
        output:
          type: any
      - name: __str__
        output:
          type: any
      - name: serialize
        output:
          type: string
    - name: ChatId
      description: 飞书会话唯一标识
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: string
          name: value
        output:
          type: any
      - name: __str__
        output:
          type: any
      - name: serialize
        output:
          type: string
    - name: FeishuMessagePayload
      description: 飞书消息负载 - 防腐层数据契约
      attributes:
      - type: FeishuMessageId
        name: message_id
      - type: ChatId
        name: chat_id
      - type: ChatType
        name: chat_type
      - type: string
        name: content
      - type: string
        name: sender_id
    aggregates:
    - name: ConversationContext
      description: 聚合根 - 飞书会话的对话上下文，用于多轮对话记忆
      attributes:
      - type: ChatId
        name: chat_id
      - type: list
        custom_type_string: list[dict]
        name: messages
      - type: SessionId
        optional: true
        name: current_session_id
      behaviors:
      - name: add_message
        inputs:
        - type: string
          name: role
        - type: string
          name: content
        output:
          type: None
      - name: set_session
        inputs:
        - type: SessionId
          name: session_id
        output:
          type: None
    ports:
    - name: FeishuClientPort
      description: 飞书客户端端口 - 处理WebSocket连接和API调用
      kind: adapter
      operations:
      - name: send_message
        inputs:
        - type: ChatId
          name: chat_id
        - type: string
          name: content
        output:
          type: FeishuMessageId
      - name: reply_message
        inputs:
        - type: FeishuMessageId
          name: message_id
        - type: string
          name: content
        output:
          type: FeishuMessageId
      - name: update_message
        inputs:
        - type: FeishuMessageId
          name: message_id
        - type: string
          name: content
        output:
          type: None
      - name: start_listener
        output:
          type: None
    - name: ConversationContextRepository
      description: 会话上下文仓储 - 持久化聊天对话历史
      kind: repository
      aggregate: ConversationContext
      operations:
      - name: save
        inputs:
        - type: ConversationContext
          name: context
        output:
          type: None
      - name: find_by_chat_id
        inputs:
        - type: ChatId
          name: chat_id
        output:
          type: ConversationContext
          optional: true
  application:
    use_cases:
    - name: HandleFeishuMessage
      kind: command
      description: 处理飞书消息 - 非流式响应
      dependencies:
      - type: FeishuClientPort
        name: feishu_client
      - type: ExecutionTriggerPort
        name: execution_trigger
      - type: ConversationContextRepository
        name: context_repo
      command:
        attributes:
        - type: FeishuMessagePayload
          name: payload
      result:
        attributes:
        - type: FeishuMessageId
          name: reply_message_id
        - type: SessionId
          name: session_id
  infrastructure:
    implementations:
    - name: LarkWsClient
      implements: FeishuClientPort
      technology: lark
      description: 基于 lark-oapi SDK 的 WebSocket 客户端实现
      attributes:
      - type: string
        name: app_id
      - type: string
        name: app_secret
    - name: SqlAlchemyConversationContextRepository
      implements: ConversationContextRepository
      technology: sql
      description: 使用 PostgreSQL 持久化会话上下文
      attributes:
      - type: Any
        custom_type_string: async_sessionmaker[AsyncSession]
        name: session_factory
