# yaml-language-server: $schema=./codegen.schema.json
name: AgentEngine
description: ''
contexts:
- name: Shared
  domain:
    value_objects:
    - name: SessionId
      description: Agent 执行会话的唯一标识
      attributes:
      - type: uuid
        name: value
    - name: JobId
      description: 调度派发任务的唯一标识
      attributes:
      - type: uuid
        name: value
    - name: TaskId
      description: 关联到远端 TaskGraph 的任务标识
      attributes:
      - type: uuid
        name: value
- name: Execution
  domain:
    aggregates:
    - name: AgentSession
      description: 聚合根 — 一次完整的 Agent 运行生命周期，包括 Prompt 组装、工具挂载和最终输出。
      attributes:
      - type: SessionId
        name: id
      - type: JobId
        name: job_id
      - type: TaskId
        optional: true
        name: task_id
      - type: SessionType
        name: session_type
      - type: dict
        name: context_payload
      - type: SessionStatus
        name: status
      - type: string
        optional: true
        name: final_output
      - type: string
        optional: true
        name: error_message
      behaviors:
      - name: start
        output:
          type: None
      - name: finish_with_success
        inputs:
        - type: string
          name: output
        output:
          type: None
      - name: finish_with_error
        inputs:
        - type: string
          name: error
        output:
          type: None
    enums:
    - name: SessionType
      description: 执行会话类型
      members:
      - name: PLANNER
        value: planner
      - name: EXECUTOR
        value: executor
    - name: SessionStatus
      members:
      - name: IDLE
        value: idle
      - name: RUNNING
        value: running
      - name: SUCCESS
        value: success
      - name: ERROR
        value: error
    ports:
    - name: AgentGateway
      description: Agent 底层调用网关 (封装 claude-agent-sdk)
      kind: adapter
      operations:
      - name: run
        inputs:
        - type: string
          name: system_prompt
        - type: string
          name: user_prompt
        - type: string
          container: list
          name: tools
        output:
          type: string
    - name: SopRepository
      description: SOP 仓储，根据 SessionType 加载不同的操作规程
      kind: repository
      aggregate: Sop
      operations:
      - name: get_sop
        inputs:
        - type: SessionType
          name: session_type
        output:
          type: string
    - name: AgentSessionRepository
      kind: repository
      aggregate: AgentSession
      operations:
      - name: save
        inputs:
        - type: AgentSession
          name: session
        output:
          type: None
      - name: delete
        inputs:
        - type: SessionId
          name: agent_session_id
        output:
          type: None
      - name: find_by_id
        inputs:
        - type: SessionId
          name: agent_session_id
        output:
          type: AgentSession
          optional: true
  application:
    use_cases:
    - name: ExecuteAgentSession
      kind: command
      dependencies:
      - type: AgentGateway
        name: agent_gateway
      - type: SopRepository
        name: sop_repo
      - type: AgentSessionRepository
        name: session_repo
      command:
        attributes:
        - type: JobId
          name: job_id
        - type: TaskId
          optional: true
          name: task_id
        - type: string
          optional: true
          name: requirement
        - type: SessionType
          name: session_type
      result:
        attributes:
        - type: SessionId
          name: session_id
        - type: boolean
          name: is_success
        - type: string
          optional: true
          name: output
  infrastructure:
    implementations:
    - name: ClaudeAgentGateway
      implements: AgentGateway
      technology: claude
      description: 封装对 Claude Agent SDK 的调用，将工具和 Prompt 注入并执行
    - name: GeminiAgentGateway
      implements: AgentGateway
      technology: gemini
      description: 封装对 Gemini Cli 的调用，将工具和 Prompt 注入并执行
    - name: SqlAlchemySessionRepository
      implements: AgentSessionRepository
      technology: sql
      description: 使用 PostgreSQL/SQLite 持久化 Agent 会话日志和状态
    - name: LocalFileSopRepository
      implements: SopRepository
      technology: local
      description: 从本地文件系统（如 docs/ 或 sops/ 目录）读取 Markdown 格式的 SOP 提示词
- name: Orchestration
  domain:
    aggregates:
    - name: DispatchJob
      description: 聚合根 — 记录一次从 TaskGraph 拉取任务并尝试执行的分发记录。
      attributes:
      - type: JobId
        name: id
      - type: TaskId
        optional: true
        name: task_id
      - type: JobStatus
        name: status
      - type: SessionId
        optional: true
        name: session_id
      behaviors:
      - name: mark_running
        inputs:
        - type: SessionId
          name: session_id
        output:
          type: None
      - name: mark_completed
        output:
          type: None
      - name: mark_failed
        inputs:
        - type: string
          name: reason
        output:
          type: None
    enums:
    - name: JobStatus
      members:
      - name: PENDING
        value: pending
      - name: RUNNING
        value: running
      - name: COMPLETED
        value: completed
      - name: FAILED
        value: failed
    value_objects:
    - name: ReadyTaskDTO
      description: 防腐层数据契约：从 TaskGraph 读取的、随时可被派发的任务快照
      attributes:
      - type: TaskId
        name: task_id
      - type: string
        name: planning_level
      - type: string
        name: name
      - type: string
        optional: true
        name: intent
    ports:
    - name: DispatchJobRepository
      kind: repository
      aggregate: DispatchJob
      operations:
      - name: save
        inputs:
        - type: DispatchJob
          name: job
        output:
          type: None
      - name: delete
        inputs:
        - type: JobId
          name: dispatch_job_id
        output:
          type: None
      - name: find_by_id
        inputs:
        - type: JobId
          name: dispatch_job_id
        output:
          type: DispatchJob
          optional: true
    - name: ExecutionTriggerPort
      description: 定义一个明确的跨上下文调用端口，用于触发 Execution 域。
      kind: adapter
      operations:
      - name: trigger_session
        inputs:
        - type: JobId
          name: job_id
        - type: TaskId
          optional: true
          name: task_id
          default: None
        - type: string
          optional: true
          name: requirement
          default: None
        output:
          type: SessionId
    - name: TaskGraphQueryPort
      description: 防腐层：读取 TaskGraph 状态的只读接口，未来可替换为事件订阅(Pub/Sub)客户端。
      kind: adapter
      operations:
      - name: fetch_ready_tasks
        output:
          type: ReadyTaskDTO
          container: list
  application:
    use_cases:
    - name: StartInitialWorkflow
      kind: command
      dependencies:
      - type: DispatchJobRepository
        name: job_repo
      - type: ExecutionTriggerPort
        name: execution_trigger
      command:
        attributes:
        - type: string
          name: raw_requirement
      result:
        attributes:
        - type: string
          name: initial_session_id
    - name: RunEventLoopTick
      kind: command
      dependencies:
      - type: TaskGraphQueryPort
        name: task_query_port
      - type: DispatchJobRepository
        name: job_repo
      - type: ExecutionTriggerPort
        name: execution_trigger
      result:
        attributes:
        - type: integer
          name: dispatched_count
  infrastructure:
    implementations:
    - name: InProcessExecutionTrigger
      implements: ExecutionTriggerPort
      technology: in
      description: 进程内直接调用 Execution 域的应用层服务 (UseCase) 触发任务
    - name: TaskGraphAdapter
      implements: TaskGraphQueryPort
      technology: task
      description: 通过 TaskGraph 服务获取 Ready 任务
    - name: SqlAlchemyDispatchJobRepository
      implements: DispatchJobRepository
      technology: sql
      description: 使用 PostgreSQL/SQLite 持久化 Job 记录
