# yaml-language-server: $schema=./codegen.schema.json
name: AgentEngine
contexts:
- name: AgentRegistry
  domain:
    ports:
    - name: BlueprintRegistryPort
      description: 蓝图注册中心接口：负责根据上下文标识符查询执行蓝图
      operations:
      - name: get_blueprint
        description: 获取指定层级和范围的执行蓝图
        inputs:
        - type: Self
          name: self
        - type: string
          name: scope_level
        - type: string
          optional: true
          name: architecture_layer
        output:
          type: ExecutionBlueprint
  infrastructure:
    implementations:
    - name: LocalMarkdownBlueprintLoader
      implements: BlueprintRegistryPort
      technology: local
      description: 基于本地 Markdown 文件的蓝图加载器
      attributes:
      - type: string
        name: base_dir
      private_methods:
      - name: _build_system_prompt
        description: 将 SOP Frontmatter 数据 and Markdown 内容整理为完整的 system_prompt 字符串
        inputs:
        - type: any
          container: map
          name: metadata
        - type: string
          name: content
        output:
          type: string
- name: Bootstrap
- name: Integration
  domain:
    aggregates:
    - name: ConversationContext
      description: 聚合根 - 飞书会话的对话上下文，用于多轮对话记忆
      base_types:
      - Aggregate
      attributes:
      - type: ChatId
        name: chat_id
      - type: dict
        container: list
        name: messages
        default: list
      - type: SessionId
        optional: true
        name: current_session_id
      behaviors:
      - name: add_message
        description: "添加消息到对话历史\n\nArgs:\n    role: 消息角色 (user/assistant)\n    content:\
          \ 消息内容"
        inputs:
        - type: Self
          name: self
        - type: string
          name: role
        - type: string
          name: content
        output:
          type: None
      - name: set_session
        description: "设置当前会话ID\n\nArgs:\n    session_id: Agent 会话ID"
        inputs:
        - type: Self
          name: self
        - type: SessionId
          name: session_id
        output:
          type: None
      - name: clear_messages
        description: 清空对话历史
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: create
        description: "创建新的对话上下文\n\nArgs:\n    chat_id: 飞书会话ID\n\nReturns:\n    新的\
          \ ConversationContext 实例"
        inputs:
        - type: Self
          container: type
          name: cls
        - type: ChatId
          name: chat_id
        output:
          type: ConversationContext
    enums:
    - name: ChatType
      description: 飞书聊天类型
      members:
      - name: P2P
        value: p2p
      - name: GROUP
        value: group
    value_objects:
    - name: ChatId
      description: 飞书会话唯一标识
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        description: 创建会话ID
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: ChatId
      - name: reconstitute
        description: 从原始值重建
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: ChatId
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
    - name: FeishuMessagePayload
      description: 飞书消息负载 - 防腐层数据契约
      attributes:
      - type: FeishuMessageId
        name: message_id
      - type: ChatId
        name: chat_id
      - type: ChatType
        name: chat_type
      - type: string
        name: content
      - type: string
        optional: true
        name: sender_id
    - name: FeishuMessageId
      description: 飞书消息唯一标识
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        description: 创建飞书消息ID
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: FeishuMessageId
      - name: reconstitute
        description: 从原始值重建
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: FeishuMessageId
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
    ports:
    - name: FeishuClientPort
      description: 飞书客户端端口 - 处理WebSocket连接和API调用
      operations:
      - name: send_message
        description: "发送新消息到会话\n\nArgs:\n    chat_id: 会话ID\n    content: 消息内容\n\n\
          Returns:\n    发送的消息ID"
        inputs:
        - type: Self
          name: self
        - type: ChatId
          name: chat_id
        - type: string
          name: content
        output:
          type: FeishuMessageId
      - name: reply_message
        description: "回复消息\n\nArgs:\n    message_id: 要回复的消息ID\n    content: 回复内容\n\
          \nReturns:\n    回复的消息ID"
        inputs:
        - type: Self
          name: self
        - type: FeishuMessageId
          name: message_id
        - type: string
          name: content
        output:
          type: FeishuMessageId
      - name: update_message
        description: "更新消息内容（用于流式输出）\n\nArgs:\n    message_id: 要更新的消息ID\n    content:\
          \ 新的消息内容"
        inputs:
        - type: Self
          name: self
        - type: FeishuMessageId
          name: message_id
        - type: string
          name: content
        output:
          type: None
      - name: set_message_handler
        description: "设置消息处理器\n\nArgs:\n    handler: 异步消息处理函数"
        inputs:
        - type: Self
          name: self
        - type: Any
          custom_type_string: Callable[[FeishuMessagePayload], Awaitable[None]]
          name: handler
        output:
          type: None
      - name: start_listener
        description: 启动 WebSocket 监听器
        inputs:
        - type: Self
          name: self
        output:
          type: None
    - name: ConversationContextRepository
      description: 会话上下文仓储 - 持久化聊天对话历史
      operations:
      - name: save
        description: "保存会话上下文\n\nArgs:\n    context: 要保存的会话上下文"
        inputs:
        - type: Self
          name: self
        - type: ConversationContext
          name: context
        output:
          type: None
      - name: find_by_chat_id
        description: "根据会话ID查找上下文\n\nArgs:\n    chat_id: 飞书会话ID\n\nReturns:\n    会话上下文，如果不存在则返回\
          \ None"
        inputs:
        - type: Self
          name: self
        - type: ChatId
          name: chat_id
        output:
          type: ConversationContext
          optional: true
      - name: delete
        description: "删除会话上下文\n\nArgs:\n    chat_id: 飞书会话ID"
        inputs:
        - type: Self
          name: self
        - type: ChatId
          name: chat_id
        output:
          type: None
  application:
    use_cases:
    - name: HandleFeishuMessage
      kind: command
      inputs:
      - type: FeishuMessagePayload
        name: payload
      outputs:
      - type: FeishuMessageId
        name: reply_message_id
      - type: SessionId
        name: session_id
      description: '处理飞书消息 - 非流式响应


        流程:

        1. 获取或创建会话上下文

        2. 生成虚拟 JobId (防腐层)

        3. 触发 Agent 执行

        4. 根据聊天类型路由回复 (P2P 发送新消息, GROUP 回复消息)

        5. 更新会话上下文'
      dependencies:
      - type: FeishuClientPort
        name: feishu_client
      - type: ExecutionTriggerPort
        name: execution_trigger
      - type: ConversationContextRepository
        name: context_repo
  infrastructure:
    implementations:
    - name: SqlAlchemyConversationContextRepository
      implements: ConversationContextRepository
      technology: sql
      description: '使用 PostgreSQL 持久化会话上下文


        TODO: 实现数据库模型映射

        当前为内存实现，用于快速原型验证'
      attributes:
      - type: Any
        custom_type_string: async_sessionmaker[AsyncSession]
        name: session_factory
      - type: ConversationContext
        container: map
        name: _cache
    - name: LarkWsClient
      implements: FeishuClientPort
      technology: lark
      description: '基于 lark-oapi SDK 的 WebSocket 客户端实现


        支持两种消息处理模式:

        1. P2P 私聊: 通过 chat_id 创建新消息

        2. GROUP 群聊: 通过 message_id 回复消息


        注意: lark-oapi 的 WebSocket 客户端是同步的，start() 方法内部调用

        loop.run_until_complete()，因此在 asyncio.run() 环境下需要通过

        run_in_executor 在线程池中运行。'
      attributes:
      - type: string
        name: app_id
      - type: string
        name: app_secret
      - type: lark.Client
        name: _client
      - type: lark.ws.Client
        name: _ws_client
      - type: Any
        optional: true
        custom_type_string: Callable[[FeishuMessagePayload], Awaitable[None]] | None
        name: _message_handler
      - type: asyncio.AbstractEventLoop
        optional: true
        name: _loop
- name: Shared
  domain:
    enums:
    - name: ModelTier
      description: 模型能力档位定义
      members:
      - name: PRO
        value: pro
      - name: FAST
        value: fast
    value_objects:
    - name: SessionId
      description: Agent 执行会话的唯一标识
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: any
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: any
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: JobId
      description: 调度派发任务的唯一标识
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: any
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: any
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: TaskId
      description: 关联到远端 TaskGraph 的任务标识
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: any
      - name: __str__
        inputs:
        - type: Self
          name: self
        output:
          type: any
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
- name: Orchestration
  domain:
    aggregates:
    - name: AgentSession
      description: 聚合根 — 一次完整的 Agent 运行生命周期，包括 Prompt 组装、工具挂载和最终输出。
      base_types:
      - Aggregate
      attributes:
      - type: SessionId
        name: id
      - type: JobId
        name: job_id
      - type: dict
        name: context_payload
      - type: SessionStatus
        name: status
      - type: string
        optional: true
        name: final_output
      - type: string
        optional: true
        name: error_message
      behaviors:
      - name: start
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: finish_with_success
        inputs:
        - type: Self
          name: self
        - type: string
          name: output
        output:
          type: None
      - name: finish_with_error
        inputs:
        - type: Self
          name: self
        - type: string
          name: error
        output:
          type: None
    - name: DispatchJob
      description: 聚合根 — 记录一次从 TaskGraph 拉取任务并尝试执行的分发记录。
      base_types:
      - Aggregate
      attributes:
      - type: JobId
        name: id
      - type: TaskId
        optional: true
        name: task_id
      - type: JobStatus
        name: status
      - type: SessionId
        optional: true
        name: session_id
      behaviors:
      - name: mark_running
        inputs:
        - type: Self
          name: self
        - type: SessionId
          name: session_id
        output:
          type: None
      - name: mark_completed
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: mark_failed
        inputs:
        - type: Self
          name: self
        - type: string
          name: reason
        output:
          type: None
    enums:
    - name: JobStatus
      members:
      - name: PENDING
        value: pending
      - name: RUNNING
        value: running
      - name: COMPLETED
        value: completed
      - name: FAILED
        value: failed
    - name: SessionStatus
      members:
      - name: IDLE
        value: idle
      - name: RUNNING
        value: running
      - name: SUCCESS
        value: success
      - name: ERROR
        value: error
    - name: TaskStatus
      description: The lifecycle state of a task.
      members:
      - name: PENDING
        value: pending
      - name: BLOCKED
        value: blocked
      - name: READY
        value: ready
      - name: IN_PROGRESS
        value: in_progress
      - name: REVIEW
        value: review
      - name: DONE
        value: done
      - name: CHANGES_REQUESTED
        value: changes_requested
      - name: SKIPPED
        value: skipped
      - name: DISCARDED
        value: discarded
    - name: PlanningLevel
      description: Defines the uncertainty and granularity of the task.
      members:
      - name: INITIATIVE
        value: initiative
      - name: MILESTONE
        value: milestone
      - name: ARCHITECTURAL
        value: architectural
      - name: FEATURE
        value: feature
      - name: ATOMIC
        value: atomic
    - name: ScopeLevel
      description: Defines the delegation level of the task, mapping directly to Agent
        roles and context boundaries.
      members:
      - name: PROJECT
        value: project
      - name: CONTEXT
        value: context
      - name: ARCHITECTURAL
        value: architectural
      - name: ATOMIC
        value: atomic
    - name: ArchitectureLayer
      description: DDD architecture layers.
      members:
      - name: DOMAIN
        value: domain
      - name: APPLICATION
        value: application
      - name: INFRASTRUCTURE
        value: infrastructure
      - name: INTERFACES
        value: interfaces
      - name: CROSS_CUTTING
        value: cross_cutting
      - name: NONE
        value: none
    - name: RecurrenceType
      members:
      - name: ON_SUCCESS
        value: on_success
      - name: CRON
        value: cron
      - name: ON_FAILURE
        value: on_failure
    value_objects:
    - name: TriggerSessionResult
      description: 触发 Agent 会话的结果
      attributes:
      - type: SessionId
        name: session_id
      - type: string
        optional: true
        name: output
      - type: boolean
        name: is_success
        default: true
    ports:
    - name: DomainEventListenerPort
      description: 端口：领域事件监听器，以异步迭代器形式持续产出事件
      operations:
      - name: listen
        description: 持续监听并逐个产出领域事件
        inputs:
        - type: Self
          name: self
        output:
          type: Any
          custom_type_string: AsyncIterator[DispatchableTaskEvent]
      - name: close
        description: 优雅关闭接口
        inputs:
        - type: Self
          name: self
        output:
          type: None
    - name: DispatchJobRepository
      operations:
      - name: save
        inputs:
        - type: Self
          name: self
        - type: DispatchJob
          name: job
        output:
          type: None
      - name: delete
        inputs:
        - type: Self
          name: self
        - type: JobId
          name: dispatch_job_id
        output:
          type: None
      - name: find_by_id
        inputs:
        - type: Self
          name: self
        - type: JobId
          name: dispatch_job_id
        output:
          type: DispatchJob
          optional: true
    - name: ExecutionTriggerPort
      description: 定义一个明确的跨上下文调用端口，用于触发 Execution 域。
      operations:
      - name: trigger_session
        inputs:
        - type: Self
          name: self
        - type: JobId
          name: job_id
        - type: string
          name: system_prompt
        - type: string
          optional: true
          name: requirement
        - type: dict
          optional: true
          name: context_payload
        - type: ModelTier
          optional: true
          name: model_tier
        output:
          type: TriggerSessionResult
    - name: AgentSessionRepository
      operations:
      - name: save
        inputs:
        - type: Self
          name: self
        - type: AgentSession
          name: session
        output:
          type: None
      - name: delete
        inputs:
        - type: Self
          name: self
        - type: SessionId
          name: agent_session_id
        output:
          type: None
      - name: find_by_id
        inputs:
        - type: Self
          name: self
        - type: SessionId
          name: agent_session_id
        output:
          type: AgentSession
          optional: true
    domain_events:
    - name: TaskReadyEvent
      description: Event emitted when a task is ready to be claimed.
      attributes:
      - type: TaskId
        name: task_id
      - type: string
        name: project_id
      - type: ScopeLevel
        name: scope_level
      - type: string
        optional: true
        name: bounded_context
      - type: ArchitectureLayer
        optional: true
        name: architecture_layer
    - name: TaskReviewRequestedEvent
      description: Event emitted when a task is submitted for review.
      attributes:
      - type: TaskId
        name: task_id
      - type: string
        name: project_id
      - type: ScopeLevel
        name: scope_level
      - type: string
        optional: true
        name: bounded_context
      - type: ArchitectureLayer
        optional: true
        name: architecture_layer
  application:
    use_cases:
    - name: HandleDispatchableTaskEvent
      kind: command
      inputs:
      - type: Any
        custom_type_string: Union[TaskReadyEvent, TaskReviewRequestedEvent]
        name: event
      outputs:
      - type: string
        name: job_id
      - type: string
        name: session_id
      description: 处理可调度任务事件（TaskReadyEvent, TaskReviewRequestedEvent）的用例：创建 DispatchJob
        -> 加载 SOP -> 触发执行
      dependencies:
      - type: DispatchJobRepository
        name: job_repo
      - type: ExecutionTriggerPort
        name: execution_trigger
      - type: BlueprintRegistryPort
        name: blueprint_registry
    - name: ExecuteAgentSession
      kind: command
      inputs:
      - type: JobId
        name: job_id
      - type: string
        name: system_prompt
      - type: string
        optional: true
        name: requirement
      - type: any
        container: map
        name: context_payload
        default: dict
      - type: ModelTier
        optional: true
        name: model_tier
      outputs:
      - type: SessionId
        name: session_id
      - type: boolean
        name: is_success
      - type: string
        optional: true
        name: output
      description: Orchestration 域的用例：管理 AgentSession 状态，并调用 Dispatching 域执行具体指令。
      dependencies:
      - type: HandleDispatchCommand
        name: dispatch_handler
      - type: AgentSessionRepository
        name: session_repo
    - name: StartInitialWorkflow
      kind: command
      inputs:
      - type: string
        name: raw_requirement
      outputs:
      - type: string
        name: initial_session_id
      description: CLI 入口：接收用户自然语言指令，加载蓝图，拉起一个 Agent Session 进行需求拆解。
      dependencies:
      - type: DispatchJobRepository
        name: job_repo
      - type: ExecutionTriggerPort
        name: execution_trigger
      - type: BlueprintRegistryPort
        name: blueprint_registry
      - type: string
        name: project_id
  infrastructure:
    implementations:
    - name: SqlAlchemyDispatchJobRepository
      implements: DispatchJobRepository
      technology: sql
      description: 使用 PostgreSQL 持久化 Job 记录
      attributes:
      - type: Any
        custom_type_string: async_sessionmaker[AsyncSession]
        name: session_factory
    - name: SqlAlchemySessionRepository
      implements: AgentSessionRepository
      technology: sql
      description: 使用 PostgreSQL 持久化 Agent 会话日志 and 状态
      attributes:
      - type: Any
        custom_type_string: async_sessionmaker[AsyncSession]
        name: session_factory
    - name: InProcessExecutionTrigger
      implements: ExecutionTriggerPort
      technology: in
      description: 进程内直接调用 Execution 域的应用层服务 (UseCase) 触发任务
      attributes:
      - type: ExecuteAgentSession
        name: execute_agent_session
    - name: PgNotifyEventListener
      implements: DomainEventListenerPort
      technology: pg
      description: 基于 PostgreSQL LISTEN/NOTIFY 的领域事件监听实现
      attributes:
      - type: Any
        custom_type_string: Union[str, PostgresDsn]
        name: dsn
      - type: string
        name: channel
      - type: asyncio.Event
        name: _stop_event
        default: asyncio.Event
- name: Dispatching
  domain:
    ports:
    - name: AgentExecutorPort
      description: Agent 执行器接口：负责与底层模型 CLI 或 SDK 交互
      operations:
      - name: execute
        description: 执行派发指令并返回回执
        inputs:
        - type: Self
          name: self
        - type: DispatchCommand
          name: command
        output:
          type: ExecutionReceipt
  application:
    use_cases:
    - name: HandleDispatchCommand
      kind: query
      inputs:
      - type: string
        name: system_prompt
      - type: string
        name: user_prompt
      - type: string
        name: session_id
      - type: ModelTier
        optional: true
        name: model_tier
      - type: string
        container: list
        name: tools
        default: 'lambda: [''Read'', ''Edit'', ''Glob'']'
      - type: any
        container: map
        name: context_payload
        default: dict
      outputs:
      - type: DispatchStatus
        name: status
      - type: string
        optional: true
        name: output
      - type: string
        optional: true
        name: fault
      description: Dispatching 上下文的应用层用例：接收指令并驱动执行器
      dependencies:
      - type: AgentExecutorPort
        name: executor
  infrastructure:
    implementations:
    - name: ClaudeAgentExecutorAdapter
      implements: AgentExecutorPort
      technology: claude
      description: 适配 Claude Agent SDK 的执行器
      attributes:
      - type: string
        container: list
        name: _stderr_output
        default: list
      private_methods:
      - name: _stderr_callback
        inputs:
        - type: Self
          name: self
        - type: string
          name: line
        output:
          type: None
