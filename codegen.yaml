# yaml-language-server: $schema=./codegen.schema.json
name: AgentEngine
contexts:
- name: AgentRegistry
  domain:
    enums:
    - name: ScopeLevel
      description: Defines the delegation level of the task, mapping directly to Agent
        roles and context boundaries.
      members:
      - name: PROJECT
        value: project
      - name: CONTEXT
        value: context
      - name: ARCHITECTURE
        value: architecture
      - name: COMPONENT
        value: component
    - name: ArchitectureLayer
      description: DDD architecture layers.
      members:
      - name: DOMAIN
        value: domain
      - name: APPLICATION
        value: application
      - name: INFRASTRUCTURE
        value: infrastructure
      - name: INTERFACES
        value: interfaces
      - name: CROSS_CUTTING
        value: cross_cutting
  application:
    ports:
    - name: AgentProfileQueryService
      operations:
      - name: get_profile
        inputs:
        - type: Self
          name: self
        - type: string
          name: scope_level
        - type: string
          optional: true
          name: architecture_layer
        output:
          type: AgentProfile
  infrastructure:
    implementations:
    - name: LocalAgentProfileQueryService
      implements: AgentProfileQueryService
      technology: local
      description: 基于本地 sops 目录查询 AgentProfile 的服务
      attributes:
      - type: Path
        name: sops_dir
- name: Bootstrap
- name: Integration
  domain:
    aggregates:
    - name: ConversationContext
      description: 聚合根 - 飞书会话的对话上下文，用于多轮对话记忆
      base_types:
      - Aggregate
      attributes:
      - type: ChatId
        name: chat_id
      - type: dict
        container: list
        name: messages
        default: list
      - type: SessionId
        optional: true
        name: current_session_id
      behaviors:
      - name: add_message
        description: "添加消息到对话历史\n\nArgs:\n    role: 消息角色 (user/assistant)\n    content:\
          \ 消息内容"
        inputs:
        - type: Self
          name: self
        - type: string
          name: role
        - type: string
          name: content
        output:
          type: None
      - name: set_session
        description: "设置当前会话ID\n\nArgs:\n    session_id: Agent 会话ID"
        inputs:
        - type: Self
          name: self
        - type: SessionId
          name: session_id
        output:
          type: None
      - name: clear_messages
        description: 清空对话历史
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: create
        description: "创建新的对话上下文\n\nArgs:\n    chat_id: 飞书会话ID\n\nReturns:\n    新的\
          \ ConversationContext 实例"
        inputs:
        - type: Self
          container: type
          name: cls
        - type: ChatId
          name: chat_id
        output:
          type: ConversationContext
    enums:
    - name: ChatType
      description: 飞书聊天类型
      members:
      - name: P2P
        value: p2p
      - name: GROUP
        value: group
    value_objects:
    - name: ChatId
      description: 飞书会话唯一标识
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        description: 创建会话ID
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: ChatId
      - name: reconstitute
        description: 从原始值重建
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: ChatId
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
    - name: FeishuMessagePayload
      description: 飞书消息负载 - 防腐层数据契约
      attributes:
      - type: FeishuMessageId
        name: message_id
      - type: ChatId
        name: chat_id
      - type: ChatType
        name: chat_type
      - type: string
        name: content
      - type: string
        optional: true
        name: sender_id
    - name: FeishuMessageId
      description: 飞书消息唯一标识
      attributes:
      - type: string
        name: value
      behaviors:
      - name: create
        description: 创建飞书消息ID
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: FeishuMessageId
      - name: reconstitute
        description: 从原始值重建
        inputs:
        - type: Self
          container: type
          name: cls
        - type: string
          name: value
        output:
          type: FeishuMessageId
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
    ports:
    - name: FeishuClientPort
      description: 飞书客户端端口 - 处理WebSocket连接和API调用
      operations:
      - name: send_message
        description: "发送新消息到会话\n\nArgs:\n    chat_id: 会话ID\n    content: 消息内容\n\n\
          Returns:\n    发送的消息ID"
        inputs:
        - type: Self
          name: self
        - type: ChatId
          name: chat_id
        - type: string
          name: content
        output:
          type: FeishuMessageId
      - name: reply_message
        description: "回复消息\n\nArgs:\n    message_id: 要回复的消息ID\n    content: 回复内容\n\
          \nReturns:\n    回复的消息ID"
        inputs:
        - type: Self
          name: self
        - type: FeishuMessageId
          name: message_id
        - type: string
          name: content
        output:
          type: FeishuMessageId
      - name: update_message
        description: "更新消息内容（用于流式输出）\n\nArgs:\n    message_id: 要更新的消息ID\n    content:\
          \ 新的消息内容"
        inputs:
        - type: Self
          name: self
        - type: FeishuMessageId
          name: message_id
        - type: string
          name: content
        output:
          type: None
      - name: set_message_handler
        description: "设置消息处理器\n\nArgs:\n    handler: 异步消息处理函数"
        inputs:
        - type: Self
          name: self
        - type: Any
          custom_type_string: Callable[[FeishuMessagePayload], Awaitable[None]]
          name: handler
        output:
          type: None
      - name: start_listener
        description: 启动 WebSocket 监听器
        inputs:
        - type: Self
          name: self
        output:
          type: None
    - name: ConversationContextRepository
      description: 会话上下文仓储 - 持久化聊天对话历史
      operations:
      - name: save
        description: "保存会话上下文\n\nArgs:\n    context: 要保存的会话上下文"
        inputs:
        - type: Self
          name: self
        - type: ConversationContext
          name: context
        output:
          type: None
      - name: find_by_chat_id
        description: "根据会话ID查找上下文\n\nArgs:\n    chat_id: 飞书会话ID\n\nReturns:\n    会话上下文，如果不存在则返回\
          \ None"
        inputs:
        - type: Self
          name: self
        - type: ChatId
          name: chat_id
        output:
          type: ConversationContext
          optional: true
      - name: delete
        description: "删除会话上下文\n\nArgs:\n    chat_id: 飞书会话ID"
        inputs:
        - type: Self
          name: self
        - type: ChatId
          name: chat_id
        output:
          type: None
  application:
    use_cases:
    - name: HandleFeishuMessage
      kind: command
      inputs:
      - type: FeishuMessagePayload
        name: payload
      outputs:
      - type: FeishuMessageId
        name: reply_message_id
      - type: SessionId
        name: session_id
      description: '处理飞书消息 - 非流式响应


        流程:

        1. 获取或创建会话上下文

        2. 触发 Agent 执行 (直接调用 Dispatching 域)

        3. 根据聊天类型路由回复 (P2P 发送新消息, GROUP 回复消息)

        4. 更新会话上下文'
      dependencies:
      - type: FeishuClientPort
        name: feishu_client
      - type: ExecuteSession
        name: execute_session
      - type: ConversationContextRepository
        name: context_repo
  infrastructure:
    implementations:
    - name: SqlAlchemyConversationContextRepository
      implements: ConversationContextRepository
      technology: sql
      description: '使用 PostgreSQL 持久化会话上下文


        TODO: 实现数据库模型映射

        当前为内存实现，用于快速原型验证'
      attributes:
      - type: Any
        custom_type_string: async_sessionmaker[AsyncSession]
        name: session_factory
      - type: ConversationContext
        container: map
        name: _cache
    - name: LarkWsClient
      implements: FeishuClientPort
      technology: lark
      description: '基于 lark-oapi SDK 的 WebSocket 客户端实现


        支持两种消息处理模式:

        1. P2P 私聊: 通过 chat_id 创建新消息

        2. GROUP 群聊: 通过 message_id 回复消息


        注意: lark-oapi 的 WebSocket 客户端是同步的，start() 方法内部调用

        loop.run_until_complete()，因此在 asyncio.run() 环境下需要通过

        run_in_executor 在线程池中运行。'
      attributes:
      - type: string
        name: app_id
      - type: string
        name: app_secret
      - type: lark.Client
        name: _client
      - type: lark.ws.Client
        name: _ws_client
      - type: Any
        optional: true
        custom_type_string: Callable[[FeishuMessagePayload], Awaitable[None]] | None
        name: _message_handler
      - type: asyncio.AbstractEventLoop
        optional: true
        name: _loop
- name: Shared
  domain:
    core:
    - name: DomainException
      description: Base class for domain exceptions.
      base_types:
      - Exception
    - name: ValueObject
      description: 值对象基类 特征： 1. 不可变（frozen=True） 2. 相等性基于所有属性值 3. 无唯一标识
      base_types:
      - BaseModel
      attributes:
      - type: Any
        name: model_config
    - name: AggregateRoot
      description: 聚合根基类 特征： 1. 继承 Entity 的所有特性 2. 管理领域事件的发布和收集 3. 确保聚合边界内的一致性
      base_types:
      - BaseModel
      attributes:
      - type: Any
        name: model_config
      - type: DomainEvent
        container: list
        name: _domain_events
      behaviors:
      - name: add_domain_event
        description: "添加领域事件\nArgs:\n    event: 要添加的领域事件实例\nRaises:\n    TypeError:\
          \ 如果 event 不是 DomainEvent 的实例"
        inputs:
        - type: Self
          name: self
        - type: DomainEvent
          name: event
        output:
          type: None
      - name: collect_events
        description: "收集并清空领域事件\nReturns:\n    收集到的所有领域事件列表（副本）"
        inputs:
        - type: Self
          name: self
        output:
          type: DomainEvent
          container: list
      - name: clear_events
        description: 清空领域事件
        inputs:
        - type: Self
          name: self
        output:
          type: None
      - name: has_events
        description: "检查是否有未处理的领域事件\n\nReturns:\n    如果有事件返回 True，否则返回 False"
        inputs:
        - type: Self
          name: self
        output:
          type: boolean
    - name: Entity
      description: 实体基类 特征： 1. 具有唯一标识（ID） 2. 相等性基于 ID 判断 3. 可变（但应通过行为方法修改） 4. 使用 UTC
        时区记录时间
      base_types:
      - BaseModel
      attributes:
      - type: Any
        name: model_config
    enums:
    - name: ModelTier
      description: 模型能力档位定义
      members:
      - name: PRO
        value: pro
      - name: FAST
        value: fast
    value_objects:
    - name: SessionId
      description: Agent 执行会话的唯一标识
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: any
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: ProjectId
      description: ''
      attributes:
      - type: string
        name: value
    - name: JobId
      description: 调度派发任务的唯一标识
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: any
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
    - name: TaskId
      description: 关联到远端 TaskGraph 的任务标识
      attributes:
      - type: uuid
        name: value
      behaviors:
      - name: create
        inputs:
        - type: Self
          container: type
          name: cls
        output:
          type: any
      - name: reconstitute
        inputs:
        - type: Self
          container: type
          name: cls
        - type: Any
          custom_type_string: Union[UUID, str]
          name: value
        output:
          type: any
      - name: serialize
        inputs:
        - type: Self
          name: self
        output:
          type: string
      - name: validate_from_primitive
        inputs:
        - type: Self
          container: type
          name: cls
        - type: any
          name: data
        output:
          type: any
- name: Orchestration
  domain:
    aggregates:
    - name: AgentSession
      description: 聚合根 — 一次完整的 Agent 运行生命周期，包括 Prompt 组装、工具挂载和最终输出。
      base_types:
      - Aggregate
      attributes:
      - type: SessionId
        name: id
      - type: TaskId
        name: task_id
      - type: ProjectId
        name: project_id
      - type: SessionStatus
        name: status
      - type: Any
        custom_type_string: dict[str, str | None]
        name: context_payload
      - type: string
        name: system_prompt
        default: ''
      - type: Message
        container: list
        name: messages
        default: list
      behaviors:
      - name: add_user_message
        inputs:
        - type: Self
          name: self
        - type: string
          name: content
        output:
          type: None
      - name: add_agent_message
        inputs:
        - type: Self
          name: self
        - type: string
          name: content
        output:
          type: None
    enums:
    - name: SessionLifeCycle
      members:
      - name: OPEN
        value: open
    - name: SessionStatus
      members:
      - name: IDLE
        value: idle
      - name: PROCESSING
        value: processing
    - name: MessageRole
      members:
      - name: SYSTEM
        value: system
      - name: USER
        value: user
      - name: ASSISTANT
        value: assistant
    value_objects:
    - name: Message
      description: ''
      attributes:
      - type: MessageRole
        name: role
      - type: string
        name: content
    ports:
    - name: AgentSessionRepository
      operations:
      - name: save
        inputs:
        - type: Self
          name: self
        - type: AgentSession
          name: session
        output:
          type: None
      - name: delete
        inputs:
        - type: Self
          name: self
        - type: SessionId
          name: agent_session_id
        output:
          type: None
      - name: find_by_id
        inputs:
        - type: Self
          name: self
        - type: SessionId
          name: agent_session_id
        output:
          type: AgentSession
          optional: true
      - name: find_by_task_id
        inputs:
        - type: Self
          name: self
        - type: TaskId
          name: task_id
        output:
          type: AgentSession
          optional: true
  application:
    use_cases:
    - name: DispatchTask
      kind: query
      inputs:
      - type: string
        name: task_id
      - type: string
        name: project_id
      - type: string
        name: scope_level
      - type: string
        optional: true
        name: architecture_layer
      - type: Any
        custom_type_string: dict[str, str | None]
        name: context_payload
        default: dict
      outputs:
      - type: string
        name: session_id
      - type: string
        name: status
      - type: string
        optional: true
        name: output
      - type: string
        optional: true
        name: fault
      description: Orchestration 应用层用例：调度任务执行
      dependencies:
      - type: AgentProfileQueryService
        name: agent_profile_query_service
      - type: ExecuteSession
        name: execute_session_use_case
      - type: AgentSessionRepository
        name: session_repository
    - name: ReviewTask
      kind: query
      inputs:
      - type: string
        name: task_id
      - type: string
        optional: true
        name: parent_id
      outputs:
      - type: string
        optional: true
        name: session_id
      - type: string
        name: status
      - type: string
        optional: true
        name: output
      - type: string
        optional: true
        name: fault
      description: Orchestration 应用层用例：审核任务
      dependencies:
      - type: AgentSessionRepository
        name: session_repository
      - type: ExecuteSession
        name: execute_session_use_case
    - name: ReviseTask
      kind: query
      inputs:
      - type: string
        name: task_id
      outputs:
      - type: string
        optional: true
        name: session_id
      - type: string
        name: status
      - type: string
        optional: true
        name: output
      - type: string
        optional: true
        name: fault
      description: Orchestration 应用层用例：任务审核不通过，重新修改
      dependencies:
      - type: AgentSessionRepository
        name: session_repository
      - type: ExecuteSession
        name: execute_session_use_case
  infrastructure:
    implementations:
    - name: SqlAlchemySessionRepository
      implements: AgentSessionRepository
      technology: sql
      description: 使用 PostgreSQL 持久化 Agent 会话日志和状态
      attributes:
      - type: Any
        custom_type_string: async_sessionmaker[AsyncSession]
        name: session_factory
- name: Dispatching
  domain:
    enums:
    - name: DispatchStatus
      members:
      - name: SUCCESS
        value: success
      - name: FAULT
        value: fault
    value_objects:
    - name: ExecutionReceipt
      description: 执行回执：Dispatching 上下文执行后的产物
      attributes:
      - type: DispatchStatus
        name: status
      - type: string
        optional: true
        name: output
      - type: string
        optional: true
        name: fault
    ports:
    - name: AgentExecutorPort
      description: Agent 执行器接口：负责与底层模型 CLI 或 SDK 交互
      operations:
      - name: execute
        description: 执行派发指令并返回回执
        inputs:
        - type: Self
          name: self
        - type: string
          name: system_prompt
        - type: string
          name: user_prompt
        - type: string
          name: session_id
        - type: ModelTier
          optional: true
          name: model_tier
        - type: string
          container: list
          optional: true
          name: tools
        - type: Any
          optional: true
          custom_type_string: dict[str, str | None] | None
          name: context_payload
        - type: Path
          optional: true
          name: cwd
        output:
          type: ExecutionReceipt
  application:
    use_cases:
    - name: ExecuteSession
      kind: query
      inputs:
      - type: string
        name: system_prompt
      - type: string
        name: user_prompt
      - type: string
        name: session_id
      - type: string
        optional: true
        name: project_id
      - type: ModelTier
        optional: true
        name: model_tier
      - type: string
        container: list
        name: tools
        default: 'lambda: [''Read'', ''Edit'', ''Glob'']'
      - type: Any
        custom_type_string: dict[str, str | None]
        name: context_payload
        default: dict
      outputs:
      - type: DispatchStatus
        name: status
      - type: string
        optional: true
        name: output
      - type: string
        optional: true
        name: fault
      description: Dispatching 上下文的应用层用例：接收指令并驱动执行器
      dependencies:
      - type: AgentExecutorPort
        name: executor
  infrastructure:
    implementations:
    - name: ClaudeAgentExecutorAdapter
      implements: AgentExecutorPort
      technology: claude
      description: 适配 Claude Agent SDK 的执行器
      attributes:
      - type: string
        container: list
        name: _stderr_output
        default: list
